[project]
name = "tubi-master"
version = "0.1.0"
description = "Curriculum planner for the TU Wien Master Bauingenieurwissenschaften"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1",
    "gunicorn>=23",
]

[dependency-groups]
# Only needed to refresh data/curriculum.json from TISS.
dev = [
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "requests>=2.32",
]

[tool.uv]
package = false
